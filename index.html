<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orrery</title>
<style>
  :root{
    --mono:ui-monospace,"Cascadia Code","JetBrains Mono","Segoe UI Mono",Consolas,monospace;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --body:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    --void:#000208;
    --radius-sm:8px;--radius-md:12px;--radius-lg:16px;
    --space-1:8px;--space-2:14px;--space-3:22px;--space-4:34px;
    --frame-src:url("frontground.png");
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--void);overflow:hidden;font-family:var(--body);color:#F0F0FA}
  #scene{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #void{z-index:0}
  #overlay{z-index:1;touch-action:none;cursor:grab}
  #overlay.drag{cursor:grabbing}

  /* temple foreground = the frontground photo, its center masked out so the void shows */
  #frame{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;will-change:transform,opacity}
  /* ground anchored at the bottom (kept where it looks right); the photo is
     scaled down from the bottom so the pillars shorten and open sky returns at
     the top. ring mask keeps the void hole in the center AND fades the photo's
     outer edges into black so there is no hard rectangle. */
  /* two composited masks (intersect):
     1) radial center hole = the void window in the middle
     2) linear top fade = pillar tops dissolve STRAIGHT up into black (no circular arc) */
  #frame .photo{position:absolute;inset:0;background:var(--frame-src) center bottom/cover no-repeat;
    transform:translateY(5.5%) scaleX(.99) scaleY(.82);transform-origin:50% 100%;
    filter:url(#fisheye);
    -webkit-mask-image:radial-gradient(ellipse 60% 62% at 50% 47%, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 32%, rgba(0,0,0,1) 62%), linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 56%, rgba(0,0,0,0) 90%);
    -webkit-mask-composite:source-in;
    mask-image:radial-gradient(ellipse 60% 62% at 50% 47%, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 32%, rgba(0,0,0,1) 62%), linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 56%, rgba(0,0,0,0) 90%);
    mask-composite:intersect}
  #frame .vig{position:absolute;inset:0;box-shadow:inset 0 0 200px 80px rgba(0,0,0,1)}

  #wash{position:fixed;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(circle at var(--wx,50%) var(--wy,50%), var(--acc,#38E0FF) 0%, transparent 60%);
    opacity:0;mix-blend-mode:screen}

  #ui{position:fixed;z-index:3;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:var(--space-1);
    opacity:0;transition:opacity .8s ease;pointer-events:none}
  #ui.on{opacity:1}
  #ui button{pointer-events:auto;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;color:#C9CDD6;
    background:rgba(5,6,10,.55);backdrop-filter:blur(6px);border:1px solid rgba(240,240,250,.16);
    border-radius:var(--radius-sm);padding:9px 14px;cursor:pointer;transition:.15s}
  #ui button:hover{color:#fff;border-color:rgba(240,240,250,.4)}
  #skip{position:fixed;z-index:6;right:16px;bottom:16px;font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;
    color:#5A5F6B;background:transparent;border:1px solid rgba(240,240,250,.12);border-radius:var(--radius-sm);padding:6px 10px;cursor:pointer}
  #skip:hover{color:#C9CDD6}

  #detail{position:fixed;inset:0;z-index:7;display:none;place-items:center;padding:5vh 5vw;
    background:radial-gradient(120% 90% at 50% 0%, color-mix(in srgb,var(--acc) 10%,transparent), rgba(2,3,8,.40) 60%),rgba(2,3,8,.34);
    opacity:0;transition:opacity .5s ease}
  #detail.on{display:grid;opacity:1}
  #detail .panel{max-width:760px;width:100%;transform:scale(.94) translateY(14px);opacity:0;transition:.55s cubic-bezier(.2,.7,.2,1);
    border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:var(--radius-lg);
    background:linear-gradient(180deg,rgba(10,12,20,.92),rgba(4,6,12,.94));
    box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 40px 120px -50px var(--acc);
    padding:clamp(26px,5vw,44px);max-height:88vh;overflow:auto}
  #detail.on .panel{transform:none;opacity:1}
  #detail .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:var(--space-2);display:flex;align-items:center;gap:10px}
  #detail .eyebrow .dot{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 14px var(--acc)}
  #detail h2{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,5vw,3rem);line-height:1.05;letter-spacing:.01em;margin-bottom:var(--space-1);color:#fff}
  #detail .sub{color:#C9CDD6;font-size:1.02rem;margin-bottom:var(--space-4)}
  #detail .sec{border-top:1px solid rgba(240,240,250,.1);padding:var(--space-2) 0;display:grid;grid-template-columns:180px 1fr;gap:var(--space-2)}
  #detail .sec h3{font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
  #detail .sec p{color:#C4C8D2;font-size:.98rem;line-height:1.6}
  #detail .sec code{font-family:var(--mono);color:#fff;background:color-mix(in srgb,var(--acc) 16%,transparent);padding:1px 6px;border-radius:5px;font-size:.85em}
  #detail .back{margin-top:var(--space-4);font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;color:var(--acc);
    background:transparent;border:1px solid var(--acc);border-radius:var(--radius-sm);padding:10px 16px;cursor:pointer;transition:.15s}
  #detail .back:hover{background:color-mix(in srgb,var(--acc) 16%,transparent)}
  @media (max-width:560px){#detail .sec{grid-template-columns:1fr;gap:6px}}
  #crt{position:fixed;inset:0;z-index:4;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.6}

  /* ---------- ORCH1 agent workspace: opaque Hermes-blue canvas over the black void ---------- */
  #ws{position:fixed;left:50%;top:50%;width:86vw;height:84vh;z-index:8;display:none;
    transform:translate(-50%,-50%) scale(.92);opacity:0;
    border-radius:14px;overflow:hidden;background:#1d1fe6; /* opaque — the black void never shows through */
    box-shadow:0 0 0 1px rgba(255,255,255,.16),0 40px 140px -40px rgba(0,0,0,.95);
    transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.2,1);
    user-select:none;-webkit-user-select:none;cursor:grab;font-family:var(--mono)}
  #ws.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #ws.pan{cursor:grabbing}
  #wsvoid{position:absolute;inset:0;z-index:0}
  #wscrt{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(2,2,40,.30) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.6}
  #wsclose{position:absolute;top:10px;right:12px;z-index:600;font-family:var(--mono);font-size:.66rem;
    letter-spacing:.12em;color:#1113b8;background:#fff;border:1px solid #c9ccf5;border-radius:var(--radius-sm);
    padding:6px 10px;cursor:pointer}
  #wsclose:hover{background:#eef0ff}
  #wsspawn{position:absolute;right:32px;bottom:32px;z-index:3;
    width:72px;height:72px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    color:#1113b8;font-size:30px;font-weight:300;background:#fff;border:1px solid #c9ccf5;
    box-shadow:0 8px 26px -10px rgba(4,4,60,.6);animation:wspulse 2.8s ease-in-out infinite;transition:transform .15s}
  #wsspawn:hover{transform:scale(1.07)}
  #wsspawn .hint{position:absolute;bottom:84px;right:0;white-space:nowrap;
    font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:#c6caff}
  @keyframes wspulse{0%,100%{box-shadow:0 8px 26px -10px rgba(4,4,60,.55)}50%{box-shadow:0 8px 34px -6px rgba(255,255,255,.45)}}
  .ws-win{position:absolute;width:380px;z-index:10;border-radius:9px;overflow:hidden;background:#fff;
    border:1px solid #c9ccf5;box-shadow:0 22px 60px -34px rgba(6,6,50,.75);
    display:flex;flex-direction:column;transition:border-color .15s;will-change:transform}
  .ws-win.focus{border-color:#1a1cd8}
  .ws-bar{display:flex;align-items:center;gap:9px;padding:8px 10px;cursor:grab;background:#eef0ff;
    border-bottom:1px solid #c9ccf5;position:relative;z-index:2}
  .ws-bar.grab{cursor:grabbing}
  .ws-avatar{width:22px;height:22px;border-radius:5px;flex:none;display:grid;place-items:center;
    font-size:12px;color:#fff;font-weight:700;background:#1d1fe6}
  .ws-name{font-family:var(--serif);font-size:.92rem;line-height:1;color:#1113b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ws-tag{font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;color:#6b6ee6}
  .ws-ctrls{margin-left:auto;display:flex;gap:5px}
  .ws-ctrls button{width:16px;height:16px;border-radius:4px;border:1px solid #c9ccf5;background:#fff;
    color:#1a1cd8;cursor:pointer;padding:0;display:grid;place-items:center;font-size:10px;line-height:1;transition:.12s}
  .ws-ctrls button:hover{background:#eef0ff;border-color:#1a1cd8}
  .ws-ctrls .ws-x:hover{background:#ffe9ea;border-color:#e0455a;color:#c8394d}
  .ws-body{position:relative;height:200px;overflow:hidden;background:#fff;transform-origin:top center;
    transition:height .34s cubic-bezier(.4,0,.2,1),transform .34s cubic-bezier(.4,0,.2,1),opacity .28s}
  .ws-bodycrt{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(29,31,230,.05) 0 1px,transparent 1px 3px);opacity:.7}
  .ws-term{position:absolute;top:0;left:0;right:0;bottom:34px;padding:12px 14px;font-size:.72rem;line-height:1.55;color:#1a1cd8;overflow:auto;overflow-wrap:break-word}
  .ws-term .p{color:#1113b8;font-weight:600}
  .ws-term .m{color:#6b6ee6}
  .ws-term .c{display:inline-block;width:7px;height:13px;background:#1a1cd8;vertical-align:-2px;animation:wsblink 1s steps(1) infinite}
  @keyframes wsblink{50%{opacity:0}}
  .ws-term div{white-space:pre-wrap}
  .ws-term .u{color:#1113b8;font-weight:600}
  .ws-term .a{color:#1a1cd8}
  .ws-term .t{color:#8a8ddd}
  .ws-term .s{color:#7b3fe4;font-weight:600}
  .ws-term .e{color:#c8394d}
  .ws-input{position:absolute;left:0;right:0;bottom:0;height:34px;display:flex;align-items:center;gap:7px;
    padding:0 12px;border-top:1px solid #dfe2ff;background:#f7f8ff;z-index:2}
  .ws-input .pfx{color:#1113b8;font-weight:700;font-size:.72rem}
  .ws-input input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:var(--mono);font-size:.72rem;color:#1a1cd8}
  .ws-input input::placeholder{color:#9ba0e8}
  /* connection ports — drag a dot onto another terminal to wire them together */
  .ws-ports{position:absolute;right:3px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:4}
  .ws-port{width:13px;height:13px;border-radius:50%;border:2px solid #fff;cursor:crosshair;touch-action:none;
    box-shadow:0 0 0 1px rgba(6,6,50,.3),0 2px 6px -2px rgba(6,6,50,.55);transition:transform .12s}
  .ws-port:hover{transform:scale(1.3)}
  .ws-port[data-type="comm"]{background:#1d1fe6}
  .ws-port[data-type="read"]{background:#12b8d4}
  .ws-port[data-type="boss"]{background:#f0a41c}
  .ws-win.lowered .ws-ports{display:none}
  #wslinks{position:absolute;inset:0;z-index:2;width:100%;height:100%;pointer-events:none}
  #wslinks path.hit{pointer-events:stroke;cursor:pointer;stroke:transparent;stroke-width:14;fill:none}
  #wslinks path.vis{fill:none;stroke-width:2.5;pointer-events:none}
  #wslinks path.tmp{fill:none;stroke-width:2;stroke-dasharray:5 5;opacity:.8;pointer-events:none}
  .ws-win.lowered{width:212px}
  .ws-win.lowered .ws-body{height:0;opacity:0;transform:perspective(600px) rotateX(-82deg) scaleY(.05)}
  .ws-win.lowered .ws-ctrls{opacity:0;pointer-events:none;width:0;overflow:hidden}
  .ws-win.lowered .ws-bar{cursor:grab;padding:9px 11px}
  .ws-win.lowered .ws-tag::before{content:"▸ "}
  @media (prefers-reduced-motion:reduce){#frame,#ui,#detail,#detail .panel{transition:none}}
  :focus-visible{outline:2px solid #8A8F98;outline-offset:2px}
</style>
</head>
<body>
<!-- weak fisheye/barrel warp for the temple photo, radiating from the center.
     displacement map = red horizontal ramp + green vertical ramp (neutral 0.5 at
     center), so feDisplacementMap pushes each pixel outward from the middle. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="fisheye" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
  <feImage preserveAspectRatio="none" x="0" y="0" width="100%" height="100%" result="mx" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' preserveAspectRatio='none'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='rgb(0,0,0)'/><stop offset='1' stop-color='rgb(255,0,0)'/></linearGradient></defs><rect width='100' height='100' fill='url(%23g)'/></svg>"/>
  <feImage preserveAspectRatio="none" x="0" y="0" width="100%" height="100%" result="my" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' preserveAspectRatio='none'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='rgb(0,0,0)'/><stop offset='1' stop-color='rgb(0,255,0)'/></linearGradient></defs><rect width='100' height='100' fill='url(%23g)'/></svg>"/>
  <feBlend in="mx" in2="my" mode="screen" result="map"/>
  <feDisplacementMap in="SourceGraphic" in2="map" scale="-86" xChannelSelector="R" yChannelSelector="G"/>
</filter></svg>
<div id="scene">
  <canvas id="void"></canvas>
  <canvas id="overlay"></canvas>
  <div id="frame"><div class="photo"></div><div class="vig"></div></div>
  <div id="crt"></div>
  <div id="wash"></div>
  <div id="ui"><button id="recenter">↺ recenter</button></div>
  <button id="skip">skip intro ▸</button>
</div>

<div id="detail"><div class="panel">
  <div class="eyebrow"><span class="dot"></span><span id="d-tag"></span></div>
  <h2 id="d-title"></h2>
  <div class="sub" id="d-sub"></div>
  <div id="d-secs"></div>
  <button class="back" id="d-back">← back to the cosmos</button>
</div></div>

<!-- ORCH1 agent workspace — blue halftone canvas; black void stays visible around it -->
<div id="ws">
  <canvas id="wsvoid"></canvas>
  <div id="wscrt"></div>
  <svg id="wslinks">
    <defs>
      <marker id="arr-read" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#7ef3ff"/></marker>
      <marker id="arr-boss" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#ffd76b"/></marker>
    </defs>
  </svg>
  <div id="wsspawn">+<span class="hint">summon agent</span></div>
  <button id="wsclose">× close</button>
</div>

<script>
// ---------- data ----------
const MANIFEST={ projects:[
  { id:"eve-ng", name:"EVE-NG Enterprise Fabric", accent:"#38E0FF", glyph:"#",
    cx:0.30, cy:0.40, nest:[0.41,0.50],
    nodes:[[0,0],[0.10,-0.05],[0.17,0.02],[0.08,0.08],[-0.02,0.06]],
    edges:[[0,1],[1,2],[2,3],[3,4],[4,0],[0,3]],
    tag:"Redundant enterprise lab · EVE-NG",
    sub:"A fault-tolerant campus fabric, designed and failure-tested in EVE-NG.",
    secs:[
      ["Topology","Dual distribution/core with a fully redundant L2/L3 fabric — no single link, switch, or gateway is a point of failure."],
      ["Redundancy","<code>MSTP</code> for loop-free L2 with deliberate per-instance root placement · <code>LACP</code> EtherChannels bonding uplinks into one logical pipe · <code>HSRP</code> first-hop gateway redundancy across the core pair."],
      ["What it proves","Built and broke it on purpose: link, switch, and gateway failover converge with no black-holing. Fabric stays up when pieces don't."],
    ] },
  { id:"orch1", name:"ORCH1", accent:"#1d1fe6", glyph:"@",
    cx:0.70, cy:0.63, nest:[0.57,0.53],
    nodes:[[0,0],[0.09,-0.06],[0.15,0.01],[0.07,0.07]],
    edges:[[0,1],[1,2],[2,3],[3,0],[0,2]],
    tag:"Self-healing orchestration · Python + Ansible",
    sub:"Closed-loop network automation that fixes itself.",
    secs:[
      ["Architecture","A <code>Python</code> control layer driving idempotent <code>Ansible</code> playbooks against network devices — intent in, converged state out."],
      ["Self-healing loop","Detect drift or fault → diagnose → remediate automatically → verify → report. For known failure classes there is no human in the path."],
      ["Results","Turns manual break-fix into automated recovery; device config continuously converges back to declared intent."],
    ] },
]};

// ---------- WebGL gray ASCII void ----------
const voidCv=document.getElementById("void");
let gl=voidCv.getContext("webgl")||voidCv.getContext("experimental-webgl");
const RAMP=" .':-=+*oxX#%@$";
let atlasTex,uni={},prog,glOk=!!gl;

function buildAtlas(){
  const cw=24,ch=32,n=RAMP.length;
  const c=document.createElement("canvas");c.width=cw*n;c.height=ch;
  const x=c.getContext("2d");x.clearRect(0,0,c.width,c.height);
  x.fillStyle="#fff";x.font="700 26px "+getComputedStyle(document.body).getPropertyValue("--mono");
  x.textAlign="center";x.textBaseline="middle";
  for(let i=0;i<n;i++)x.fillText(RAMP[i],i*cw+cw/2,ch/2+1);
  return c;
}
function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));glOk=false;}return s;}
function initGL(){
  const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
  const fs=`precision highp float;
  uniform vec2 uRes;uniform float uTime;uniform vec2 uPan;uniform sampler2D uAtlas;uniform float uCount;uniform float uCell;
  uniform float uZoom;uniform vec2 uFocus;
  float hash(vec2 p){p=fract(p*vec2(443.897,441.423));p+=dot(p,p+vec2(19.19,17.71));return fract((p.x+p.y)*p.x);}
  float vn(vec2 p){vec2 i=floor(p),f=fract(p);float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));vec2 u=f*f*(3.-2.*f);return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}
  float fbm(vec2 p){float s=0.,a=.5;mat2 rot=mat2(0.8,0.6,-0.6,0.8);for(int i=0;i<4;i++){s+=a*vn(p);p=rot*p*2.03;a*=.5;}return s;}
  void main(){
    vec2 focusPx=uFocus*uRes;
    // zoom = dive INTO the focus point: compress sampled coords toward focus as uZoom grows
    vec2 frag=focusPx+(gl_FragCoord.xy-focusPx)/uZoom + uPan*uRes;
    vec2 cellC=floor(frag/uCell);
    vec2 local=fract(frag/uCell);
    float patches=fbm(cellC*0.03);
    float grain=(vn(cellC*0.9+uTime*0.55)-0.5)*0.13;
    float ditherN=(hash(gl_FragCoord.xy)-0.5)*0.05;
    float L=clamp(patches*0.85+grain+ditherN,0.0,1.0);
    float idx=floor(L*(uCount-0.001));
    vec2 auv=vec2((idx+local.x)/uCount, local.y);
    float cov=texture2D(uAtlas,auv).a;
    float bright=0.04+0.15*patches;
    bright*=1.0+1.9*clamp((uZoom-1.0)/7.0,0.0,1.0); // dived: scaled-up dither stays visible behind the detail panel
    vec3 col=vec3(0.40,0.43,0.50)*bright*cov;
    // camera-space vignette: side edges, bottom 15%, top ~5% fall into darkness (gl y-up)
    vec2 v=gl_FragCoord.xy/uRes;
    float vig=smoothstep(0.0,0.16,v.x)*smoothstep(0.0,0.16,1.0-v.x)
             *smoothstep(0.0,0.15,v.y)
             *smoothstep(0.0,0.06,1.0-v.y);
    col*=0.12+0.88*vig;
    gl_FragColor=vec4(col,1.0);
  }`;
  prog=gl.createProgram();gl.attachShader(prog,compile(gl.VERTEX_SHADER,vs));gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){glOk=false;return;}
  gl.useProgram(prog);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,"p");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  ["uRes","uTime","uPan","uAtlas","uCount","uCell","uZoom","uFocus"].forEach(k=>uni[k]=gl.getUniformLocation(prog,k));
  gl.uniform1f(uni.uCount,RAMP.length);gl.uniform1f(uni.uZoom,1);gl.uniform2f(uni.uFocus,0.5,0.5);
  atlasTex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,atlasTex);

  [[0,0,'x'],[-1,-1,'.'],[1,1,'.'],[1,-1,'.'],[-1,1,'.']],

function nodePoints(p,sx,sy,spread){return p.nodes.map(n=>[sx+n[0]*W*spread,sy+n[1]*H*spread]);}

  for(let i=0;i<7;i++){const a=rnd()*6.28,d=0.35+rnd()*0.95;h.push([Math.cos(a)*d,Math.sin(a)*d,RAMP[1+Math.floor(rnd()*(RAMP.length-2))],0.3+rnd()*0.5]);}

// ---------- persistent title — screen-space (hooked to the camera), top-center,
// built from dither cells sampled off a rasterized "ORRERY", twinkling white ----------
let titleCells=null,titleBox=null,titleSprite=null;
function buildTitleCells(){
  const th=Math.max(15,Math.min(W*0.088,H*0.052));   // glyph height, device px (W bound keeps narrow screens legible)
  const g=Math.max(2,Math.round(th/17));             // dither cell size, device px — finer = more detailed
  const c=document.createElement("canvas");
  const x=c.getContext("2d",{willReadFrequently:true});
  x.font="700 "+th+"px "+MONO();
  const tw=x.measureText("ORRERY").width;
  c.width=Math.ceil(tw+g*4);c.height=Math.ceil(th*1.4);
  x.font="700 "+th+"px "+MONO();x.textAlign="center";x.textBaseline="middle";
  x.fillStyle="#fff";x.fillText("ORRERY",c.width/2,c.height/2);
  const img=x.getImageData(0,0,c.width,c.height).data;
  titleCells=[];
  for(let gy=0;gy<c.height;gy+=g)for(let gx=0;gx<c.width;gx+=g){
    const px=Math.min(c.width-1,gx+(g>>1)),py=Math.min(c.height-1,gy+(g>>1));
    const a=img[(py*c.width+px)*4+3]/255;
    if(a>0.32)titleCells.push({x:gx,y:gy,cov:a,rnd:hash2(gx,gy)});  // lower threshold keeps soft edge cells for texture
  }
  titleBox={w:c.width,h:c.height,g};
  titleSprite=c; // keep the solid "ORRERY" raster to cast a clean whole-shape glow
}
function drawPersistentTitle(t,alpha){
  if(!titleCells)buildTitleCells();
  const {w,h,g}=titleBox;
  const ox=(W-w)/2, oy=H*0.078-h/2;
  ctx.save();
  const spSeed=(t*2.5)|0;
  // white GLOW cast from the whole ORRERY shape (a few big-blur draws — clean halo,
  // no per-cell stacking, so it glows instead of blowing out). gentle breathing pulse.
  const pulse=reduce?1:(0.85+0.15*Math.sin(t*1.6));
  ctx.globalCompositeOperation="lighter";ctx.shadowColor="rgba(255,255,255,.95)";
  const glowSteps=[[22*dpr,.12],[12*dpr,.15],[5*dpr,.2]];
  for(const gs of glowSteps){ctx.shadowBlur=gs[0]*pulse;ctx.globalAlpha=alpha*gs[1]*pulse;ctx.drawImage(titleSprite,ox,oy);}
  ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.globalCompositeOperation="source-over";
  // crisp dithered cells on top — keeps the ASCII texture + sparkle over the glow
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="600 "+(g*1.35)+"px "+MONO();
  ctx.shadowColor="rgba(255,255,255,.9)";ctx.shadowBlur=2.5*dpr;
  for(const cl of titleCells){
    const tw2=reduce?1:(0.7+0.3*Math.sin(t*2.3+cl.rnd*6.283));
    const L=Math.min(1,cl.cov*tw2);
    const sp=!reduce&&hash2(cl.x+spSeed*131,cl.y)>0.99;
    const ch=sp?"+":RAMP[Math.max(1,Math.floor(L*(RAMP.length-1)))];
    const wht=sp?1:0.75*L;
    const r=Math.round(230+25*wht),gg=Math.round(236+19*wht),b=Math.round(244+11*wht);
    ctx.fillStyle=`rgba(${r},${gg},${b},${(alpha*(sp?1:0.45+0.5*L)).toFixed(3)})`;
    ctx.fillText(ch,ox+cl.x+g/2,oy+cl.y+g/2);
  }

  ctx.restore();
}

function wsFbm(x,y){let s=0,a=.5;for(let i=0;i<4;i++){s+=a*valueNoise2(x,y);x*=2.03;y*=2.03;a*=.5;}return s;}
function drawWs(t){
  wsFrame++;if(wsFrame%2)return;                 // ~30fps — plenty for slow grain
  wsCtx.setTransform(1,0,0,1,0,0);
  wsCtx.fillStyle="#1d1fe6";wsCtx.fillRect(0,0,wsW,wsH); // opaque base — nothing shows through
  const c=6*wsDpr,px=wsPan.x*wsDpr,py=wsPan.y*wsDpr;

const AGENT_PORT=new URLSearchParams(location.search).get("agents")||"57253";

const wsUsedNames=new Set();
function wsPickName(){
  const free=WS_NAMES.filter(n=>!wsUsedNames.has(n));
  let name=free.length?wsRand(free):wsRand(WS_NAMES)+(2+Math.floor(Math.random()*98));
  wsUsedNames.add(name);return name;

function wsPut(term,cls,text){const d=document.createElement("div");d.className=cls;d.textContent=text;
  term.appendChild(d);term.scrollTop=term.scrollHeight;return d;}
async function wsConnect(win,name){
  const term=win.querySelector(".ws-term"),inp=win.querySelector(".ws-input input");
  let thinking=null;const clearThink=()=>{if(thinking){thinking.remove();thinking=null;}};
  const send=text=>fetch(AGENT_API+"/session/"+win.dataset.sid+"/input",
    {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text})})
    .catch(()=>wsPut(term,"e","✕ send failed — is the agent server still running?"));
  inp.addEventListener("keydown",e=>{
    if(e.key==="Escape"){inp.blur();e.stopPropagation();return;}
    if(e.key!=="Enter")return;
    const v=inp.value.trim();if(!v)return;inp.value="";
    wsPut(term,"u","› "+v);
    if(win.dataset.sid)send(v);
    else wsPut(term,"e","agent server offline — run `npm run agents`, then summon a new agent");
  });
  try{
    const r=await fetch(AGENT_API+"/session",{method:"POST",
      headers:{"content-type":"application/json"},body:JSON.stringify({name})});
    if(!r.ok)throw new Error("session create failed");
    const sess=await r.json();win.dataset.sid=sess.id;
    const es=new EventSource(AGENT_API+"/session/"+sess.id+"/events");win._es=es;
    es.onmessage=ev=>{
      const m=JSON.parse(ev.data);
      if(m.type==="hello"){wsPut(term,"m","connected · "+m.cwd);return;}
      if(m.type==="meta"&&m.text==="thinking…"){clearThink();thinking=wsPut(term,"m","thinking…");return;}
      clearThink();
      if(m.type==="meta")wsPut(term,"m",m.text);
      else if(m.type==="text")wsPut(term,"a",m.text);
      else if(m.type==="tool")wsPut(term,"t","▸ "+m.name+(m.hint?": "+m.hint:""));
      else if(m.type==="swarm")wsPut(term,"s",(m.boss?"⚑ order from ":"⇄ ")+m.from+": "+m.text);
      else if(m.type==="error")wsPut(term,"e","✕ "+m.text);
    };
  }catch(_){
    wsPut(term,"e","agent server offline — run `npm run agents` to give this terminal a real Claude brain");
  }
}
function wsDisconnect(win){
  wsUsedNames.delete(win.dataset.name);
  if(win._es)win._es.close();
  if(win.dataset.sid)fetch(AGENT_API+"/session/"+win.dataset.sid,{method:"DELETE"}).catch(()=>{});
  wsRemoveLinksFor(win);
}

// point on `rect`'s border where the segment from `pt` to the rect center crosses
function wsEdgePoint(rect,pt){
  const cx=rect.x+rect.w/2,cy=rect.y+rect.h/2,vx=pt.x-cx,vy=pt.y-cy;
  const k=Math.min(vx?Math.abs(rect.w/2/vx):1e9,vy?Math.abs(rect.h/2/vy):1e9);
  return{x:cx+vx*Math.min(1,k),y:cy+vy*Math.min(1,k)};
}
function wsUpdateLinks(){
  const wr=ws.getBoundingClientRect();
  for(const l of wsLinks){
    const port=l.from.querySelector('.ws-port[data-type="'+l.type+'"]');
    const anchor=(port&&port.offsetParent?port:l.from).getBoundingClientRect();
    const p1={x:anchor.left+anchor.width/2-wr.left,y:anchor.top+anchor.height/2-wr.top};
    const t=l.to.getBoundingClientRect();
    const p2=wsEdgePoint({x:t.left-wr.left,y:t.top-wr.top,w:t.width,h:t.height},p1);
    const d=`M${p1.x.toFixed(1)},${p1.y.toFixed(1)}L${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
    l.vis.setAttribute("d",d);l.hit.setAttribute("d",d);
  }
}
function wsRemoveLink(l,silent){
  const i=wsLinks.indexOf(l);if(i<0)return;
  wsLinks.splice(i,1);l.vis.remove();l.hit.remove();
  if(!silent&&l.id)fetch(AGENT_API+"/link/"+l.id,{method:"DELETE"}).catch(()=>{});
  for(const w of[l.from,l.to])if(w.isConnected)
    wsPut(w.querySelector(".ws-term"),"m","⌁ "+WS_LINK_LABEL[l.type]+" link removed ("+l.from.dataset.name+" → "+l.to.dataset.name+")");
}
function wsRemoveLinksFor(win){
  for(let i=wsLinks.length-1;i>=0;i--){const l=wsLinks[i];
    if(l.from===win||l.to===win){wsLinks.splice(i,1);l.vis.remove();l.hit.remove();}}
}
async function wsCreateLink(a,b,type){
  const termA=a.querySelector(".ws-term");
  if(!a.dataset.sid||!b.dataset.sid){wsPut(termA,"e","✕ can't link — agent server offline");return;}
  if(wsLinks.some(l=>l.type===type&&((l.from===a&&l.to===b)||(type==="comm"&&l.from===b&&l.to===a))))return;
  try{
    const r=await fetch(AGENT_API+"/link",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({from:a.dataset.sid,to:b.dataset.sid,type})});
    if(!r.ok)throw 0;
    const {id}=await r.json();
    const st=WS_LINK_STYLE[type];
    const vis=wsMkPath("vis"),hit=wsMkPath("hit");
    vis.setAttribute("stroke",st.c);if(st.dash)vis.setAttribute("stroke-dasharray",st.dash);
    if(st.arrow)vis.setAttribute("marker-end",st.arrow);
    const link={id,from:a,to:b,type,vis,hit};
    hit.addEventListener("click",()=>wsRemoveLink(link));
    wsLinks.push(link);wsUpdateLinks();
    const msg={comm:"⌁ linked: can now message ",read:"⌁ linked: you can now read the chat of ",boss:"⌁ linked: you now command "}[type];
    wsPut(termA,"m",msg+b.dataset.name);
    wsPut(b.querySelector(".ws-term"),"m",{comm:"⌁ linked: can now message ",read:"⌁ "+a.dataset.name+" can now read your chat",boss:"⌁ "+a.dataset.name+" is now your manager"}[type]+(type==="comm"?a.dataset.name:""));
  }catch(_){wsPut(termA,"e","✕ link failed");}
}
// temp line while dragging from a port
let wsTmpPath=null;
function wsTmpLine(port,cx,cy){
  const wr=ws.getBoundingClientRect(),pr=port.getBoundingClientRect();
  if(!wsTmpPath){wsTmpPath=wsMkPath("tmp");wsTmpPath.setAttribute("stroke",WS_LINK_STYLE[port.dataset.type].c);}
  wsTmpPath.setAttribute("d",`M${pr.left+pr.width/2-wr.left},${pr.top+pr.height/2-wr.top}L${cx-wr.left},${cy-wr.top}`);
}
function wsClearTmp(){if(wsTmpPath){wsTmpPath.remove();wsTmpPath=null;}}
function wsFocus(win){wsZ++;win.style.zIndex=wsZ;
  ws.querySelectorAll(".ws-win").forEach(w=>w.classList.remove("focus"));win.classList.add("focus");}
function wsFocusInput(win){const i=win.querySelector(".ws-input input");
  if(i&&!win.classList.contains("lowered"))i.focus();}
function wsAgent(){
  const name=wsPickName(),glyph=wsRand(WS_GLYPHS),tag=wsRand(WS_TAGS);
  const win=document.createElement("div");win.className="ws-win";win.dataset.name=name;
  const r=ws.getBoundingClientRect();
  // cascade to the upper-left of the spawn node so the + stays visible
  const ox=r.width/2-460+(wsSpawnN%5)*30,oy=r.height/2-250+(wsSpawnN%5)*26;
  win.style.left=Math.max(12,ox)+"px";win.style.top=Math.max(12,oy)+"px";
  wsSpawnN++;
  win.innerHTML=
    '<div class="ws-bar">'+
      '<div class="ws-avatar">'+glyph+'</div>'+
      '<div class="ws-name">'+name+'</div>'+
      '<div class="ws-tag">'+tag+'-'+String(1000+Math.floor(Math.random()*8999))+'</div>'+
      '<div class="ws-ctrls">'+
        '<button class="ws-lower" title="lower">–</button>'+
        '<button class="ws-fill" title="fill">▢</button>'+
        '<button class="ws-x" title="close">×</button>'+
      '</div>'+
    '</div>'+
    '<div class="ws-body">'+
      '<div class="ws-bodycrt"></div>'+
      '<div class="ws-term"><div><span class="p">'+name.toLowerCase()+'@orrery</span>:~$ claude</div></div>'+
      '<div class="ws-input"><span class="pfx">›</span>'+
        '<input placeholder="ask · cd &lt;path&gt; · @name msg · @all msg" spellcheck="false" autocomplete="off"></div>'+
    '</div>'+
    '<div class="ws-ports">'+
      '<div class="ws-port" data-type="comm" title="drag to a terminal: communicate — both can message each other"></div>'+
      '<div class="ws-port" data-type="read" title="drag to a terminal: read — this agent can read their chat"></div>'+
      '<div class="ws-port" data-type="boss" title="drag to a terminal: command — this agent instructs them like an operator"></div>'+
    '</div>';
  ws.appendChild(win);
  win.animate([{transform:"scale(.2)",opacity:0},{transform:"scale(1)",opacity:1}],
    {duration:340,easing:"cubic-bezier(.2,.7,.2,1)"});
  wsFocus(win);wsWire(win);wsConnect(win,name);wsFocusInput(win);return win;
}
function wsWire(win){
  const bar=win.querySelector(".ws-bar"),body=win.querySelector(".ws-body");let prev=null;
  win.addEventListener("pointerdown",()=>wsFocus(win));
  // terminal feel: clicking anywhere in the window (except its control
  // buttons) puts the caret in the input line
  win.addEventListener("pointerup",e=>{if(!e.target.closest(".ws-ctrls"))wsFocusInput(win);});
  win.querySelector(".ws-x").onclick=e=>{e.stopPropagation();wsDisconnect(win);
    win.animate([{opacity:1,transform:"scale(1)"},{opacity:0,transform:"scale(.92)"}],{duration:200}).onfinish=()=>win.remove();};
  win.querySelector(".ws-fill").onclick=e=>{e.stopPropagation();
    if(win.classList.contains("lowered"))return;
    if(win.classList.contains("max")){win.classList.remove("max");
      if(prev){win.style.left=prev.l;win.style.top=prev.t;win.style.width=prev.w;body.style.height="";}
    }else{prev={l:win.style.left,t:win.style.top,w:win.style.width};
      const r=ws.getBoundingClientRect();
      win.classList.add("max");win.style.left="12px";win.style.top="12px";
      win.style.width=(r.width-24)+"px";body.style.height=(r.height-70)+"px";}
  };
  win.querySelector(".ws-lower").onclick=e=>{e.stopPropagation();win.classList.add("lowered");};
  // link ports: drag a dot onto another window to wire the two agents
  win.querySelectorAll(".ws-port").forEach(port=>{
    let linking=false;
    port.addEventListener("pointerdown",e=>{
      e.stopPropagation();e.preventDefault();linking=true;
      try{port.setPointerCapture(e.pointerId);}catch(_){}
      wsTmpLine(port,e.clientX,e.clientY);
    });
    port.addEventListener("pointermove",e=>{if(linking)wsTmpLine(port,e.clientX,e.clientY);});
    port.addEventListener("pointerup",e=>{
      if(!linking)return;linking=false;wsClearTmp();
      const hit=document.elementFromPoint(e.clientX,e.clientY);
      const target=hit&&hit.closest(".ws-win");
      if(target&&target!==win)wsCreateLink(win,target,port.dataset.type);
    });
    port.addEventListener("pointercancel",()=>{linking=false;wsClearTmp();});
  });
  let drag=null;
  bar.addEventListener("pointerdown",e=>{
    if(e.target.closest(".ws-ctrls"))return;
    if(win.classList.contains("max"))return;
    wsFocus(win);
    const r=win.getBoundingClientRect(),wr=ws.getBoundingClientRect();
    drag={dx:e.clientX-r.left,dy:e.clientY-r.top,moved:0,wr};
    bar.classList.add("grab");try{bar.setPointerCapture(e.pointerId);}catch(_){}
  });
  bar.addEventListener("pointermove",e=>{
    if(!drag)return;
    const nx=e.clientX-drag.wr.left-drag.dx,ny=e.clientY-drag.wr.top-drag.dy;
    drag.moved+=Math.abs(e.movementX)+Math.abs(e.movementY);
    const maxX=drag.wr.width-win.offsetWidth-4,maxY=drag.wr.height-win.offsetHeight-4;
    win.style.left=Math.max(4,Math.min(maxX,nx))+"px";
    win.style.top=Math.max(4,Math.min(maxY,ny))+"px";
  });
  bar.addEventListener("pointerup",()=>{
    bar.classList.remove("grab");
    if(drag&&drag.moved<5&&win.classList.contains("lowered")){win.classList.remove("lowered");body.style.height="";wsFocus(win);wsFocusInput(win);}
    drag=null;
  });
}

// pan the workspace interior — background drag moves the blue void AND the windows (bounded world)
let wsPanDrag=null;
ws.addEventListener("pointerdown",e=>{
  if(e.target.closest(".ws-win")||e.target.closest("#wsspawn")||e.target.closest("#wsclose")
    ||e.target.closest("#wslinks"))return; // clicking a wire deletes it, not pans
  wsPanDrag={x:e.clientX,y:e.clientY};ws.classList.add("pan");
  try{ws.setPointerCapture(e.pointerId);}catch(_){}
});
ws.addEventListener("pointermove",e=>{
  if(!wsPanDrag)return;
  const r=ws.getBoundingClientRect();
  const dx=e.clientX-wsPanDrag.x,dy=e.clientY-wsPanDrag.y;
  const nx=Math.max(-r.width*.75,Math.min(r.width*.75,wsPan.x+dx));
  const ny=Math.max(-r.height*.75,Math.min(r.height*.75,wsPan.y+dy));
  const ax=nx-wsPan.x,ay=ny-wsPan.y;
  wsPan.x=nx;wsPan.y=ny;
  ws.querySelectorAll(".ws-win").forEach(w=>{
    w.style.left=(parseFloat(w.style.left)+ax)+"px";
    w.style.top=(parseFloat(w.style.top)+ay)+"px";
  });
  wsPanDrag={x:e.clientX,y:e.clientY};
});
function wsPanEnd(){wsPanDrag=null;ws.classList.remove("pan");}
ws.addEventListener("pointerup",wsPanEnd);
ws.addEventListener("pointercancel",wsPanEnd);

function openWorkspace(){
  if(wsOpen)return;wsOpen=true;
  document.getElementById("ui").style.visibility="hidden"; // recenter button pans the map behind — hide it
  ws.style.display="block";wsResize();
  if(!ws.querySelector(".ws-win"))wsAgent();     // seed one agent so it's never empty
  requestAnimationFrame(()=>ws.classList.add("on"));
  history.replaceState(null,"","#orch1");
}
function closeWorkspace(){
  if(!wsOpen)return;wsOpen=false;
  document.getElementById("ui").style.visibility="";
  ws.classList.remove("on");
  setTimeout(()=>{if(!wsOpen)ws.style.display="none";},480);
  history.replaceState(null,"","#");
  endDive();
}
document.getElementById("wsclose").onclick=closeWorkspace;
document.getElementById("wsspawn").addEventListener("click",()=>wsAgent());

// ---------- main loop ----------
function render(now){
  const t=now/1000,it=(now-boot.t0)/1000;
  pan.x+=(panTarget.x-pan.x)*0.12;pan.y+=(panTarget.y-pan.y)*0.12;

  // dive camera
  if(dive){const dp=Math.min(1,(now-dive.t0)/dive.dur);cam.zoom=1+easeIn(dp)*7;
    if(dp>0.5&&!dive.opened){dive.opened=true;
      if(dive.p.id==="orch1")openWorkspace();else openDetail(dive.p);}
    wash.style.opacity=String(0.55*Math.sin(Math.min(1,dp)*Math.PI));
  }
  // undive camera — eased zoom back out after closing a constellation
  if(undive){const up=Math.min(1,(now-undive.t0)/undive.dur);const ue=1-Math.pow(1-up,3);
    cam.zoom=undive.from+(1-undive.from)*ue;
    if(up>=1){undive=null;cam.zoom=1;cam.fx=cam.fy=0.5;}
  }
  const camK=Math.max(0,(cam.zoom-1)/7); // 0 at rest, 1 fully dived

  // void — pans with the camera (world-stable) like the stars/constellations.
  if(glOk){gl.useProgram(prog);gl.uniform1f(uni.uTime,t);gl.uniform2f(uni.uPan,-pan.x,pan.y);
    gl.uniform1f(uni.uZoom,cam.zoom);gl.uniform2f(uni.uFocus,cam.fx,cam.fy);gl.drawArrays(gl.TRIANGLES,0,3);}

  // ORCH1 workspace — its blue halftone void animates while open; link
  // wires track their windows through drags and pans
  if(wsOpen){drawWs(t);wsUpdateLinks();}

  let beat,reveal=0,titleAlpha=0,zoomP=0,interactive=false,titleH=Math.min(W*0.1,H*0.19);
  const T=boot.T;
  if(it<T.type){beat=0;}
  else if(it<T.zoomStart){beat=1;titleAlpha=1;}
  else if(it<T.doneT){beat=2;zoomP=(it-T.zoomStart)/T.zoom;reveal=smooth(0,0.5,zoomP);
    titleH*=1+7*easeIn(zoomP);titleAlpha=1-smooth(0.38,0.82,zoomP);}
  else{beat=3;reveal=1;interactive=true;}
  if(reduce&&it>0.1){beat=3;reveal=1;interactive=true;titleAlpha=0;}
  if(interactive&&!boot.done){boot.done=true;
    document.getElementById("ui").classList.add("on");document.getElementById("skip").style.display="none";}

  // temple image: rises up from below during the constellation "coming-together" phase
  // (boot beat 2, the same zoomP that pulls the constellations into place), then sits
  // static. No mouse parallax. The dive scales/fades it.
  let fRise;
  if(reduce||boot.done) fRise=1;
  else if(beat===2) fRise=smooth(0.05,0.85,zoomP);
  else fRise=0;
  if(dive||undive){const ox=dive?dive.cssx:undive.cssx,oy=dive?dive.cssy:undive.cssy;
    frameEl.style.transformOrigin=ox+"px "+oy+"px";
    frameEl.style.transform=`scale(${(1+camK*3.4).toFixed(3)})`;
    frameEl.style.opacity=String(Math.max(0,1-camK*1.3));
  } else {
    const rO=1-Math.pow(1-fRise,3);                    // easeOut settle
    const ty=(1-rO)*innerHeight*0.30;                  // starts ~30vh low, rises to 0
    frameEl.style.transformOrigin="50% 50%";
    frameEl.style.transform=`translate3d(0,${ty.toFixed(1)}px,0)`;
    frameEl.style.opacity=String(Math.min(1,fRise*1.5));
  }

  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
  if(!glOk){ctx.fillStyle="#000208";ctx.fillRect(0,0,W,H);}

  if(reveal<1){const bh=H*reveal;ctx.fillStyle="#000107";
    ctx.fillRect(0,0,W,H/2-bh/2);ctx.fillRect(0,H/2+bh/2,W,H/2-bh/2);
    if(beat===2){ctx.save();ctx.globalAlpha=(1-reveal)*0.5;ctx.fillStyle="rgba(255,255,255,.8)";ctx.fillRect(0,H/2-1.5,W,3);ctx.restore();}}

  ctx.save();
  // apply camera dive zoom to the star/constellation layer around the focus point
  if(cam.zoom!==1){ctx.translate(cam.fpx,cam.fpy);ctx.scale(cam.zoom,cam.zoom);ctx.translate(-cam.fpx,-cam.fpy);}
  if(reveal<1){const bh=H*reveal;ctx.beginPath();ctx.rect(0,H/2-bh/2,W,bh);ctx.clip();}
  if(interactive)drawStars(1); else if(reveal>0)drawStars(reveal*0.8);
  let anyHover=false;const zc=Math.max(0,Math.min(1,zoomP));
  for(const p of MANIFEST.projects){
    let sx,sy,spread,nodeK,ca;
    if(interactive){[sx,sy]=worldScreen(p);spread=1;nodeK=1;ca=1;}
    else if(zoomP>0){const e=easeInOut(zc);const[wx,wy]=worldScreen(p);
      sx=p.nest[0]*W+(wx-p.nest[0]*W)*e;sy=p.nest[1]*H+(wy-p.nest[1]*H)*e;
      spread=0.1+0.9*e;nodeK=0.3+0.7*e;ca=smooth(0.2,0.8,zoomP);}
    else continue;
    if(drawConstellation(p,sx,sy,spread,nodeK,ca,interactive&&!dive))anyHover=true;
  }
  ctx.restore();
  ov.style.cursor=drag?"grabbing":(anyHover&&!dive?"pointer":"grab");

  if(titleAlpha>0.01){const typed=boot.typed(it-T.type);const shown=(it<T.typeEnd)?"Orrery".slice(0,typed):"Orrery";
    const cur=it<T.typeEnd&&Math.floor(it*2.6)%2===0;
    if(shown.length)drawTitle(W/2,H/2,titleH,titleAlpha,shown,cur);else if(cur)drawTitle(W/2,H/2,titleH,titleAlpha,"",true);}

  // persistent dithered title — fades in as the boot zoom lands, dims while dived
  if(boot.done){
    const tin=reduce?1:smooth(T.doneT,T.doneT+1.2,it);
    const ta=tin*Math.max(0,1-camK*1.2);
    if(ta>0.01)drawPersistentTitle(t,ta);
  }

  requestAnimationFrame(render);
}
resize();
requestAnimationFrame(render);
addEventListener("load",()=>{const h=location.hash.slice(1);const p=MANIFEST.projects.find(x=>x.id===h);
  if(p){boot.skip();setTimeout(()=>{if(p.id==="orch1")openWorkspace();else openDetail(p);},200);}});
</script>
